<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 100 18" shape-rendering="crispEdges" style="image-rendering:pixelated;">
  <!-- shelf -->
  <rect x="0" y="16" width="100" height="1" fill="#3d4a6b"/>
  <rect x="0" y="17" width="100" height="1" fill="#2d3b58"/>

  <!-- 1. Mini kolba (echo elixiru) -->
  <rect x="5" y="3" width="2" height="1" fill="#5f7a9f"/>
  <rect x="4" y="4" width="4" height="1" fill="#7a8cb3"/>
  <rect x="4" y="5" width="1" height="3" fill="#5f7a9f"/>
  <rect x="7" y="5" width="1" height="3" fill="#5f7a9f"/>
  <rect x="3" y="8" width="1" height="1" fill="#5f7a9f"/>
  <rect x="2" y="9" width="1" height="6" fill="#5f7a9f"/>
  <rect x="8" y="8" width="1" height="1" fill="#5f7a9f"/>
  <rect x="9" y="9" width="1" height="6" fill="#5f7a9f"/>
  <rect x="3" y="15" width="6" height="1" fill="#5f7a9f"/>
  <rect x="3" y="11" width="6" height="4" fill="#4decd4"/>
  <rect x="3" y="10" width="6" height="1" fill="#7c4dff"/>

  <!-- 2. Probówka -->
  <rect x="17" y="3" width="4" height="1" fill="#7a8cb3"/>
  <rect x="17" y="4" width="1" height="11" fill="#5f7a9f"/>
  <rect x="20" y="4" width="1" height="11" fill="#5f7a9f"/>
  <rect x="17" y="15" width="4" height="1" fill="#5f7a9f"/>
  <rect x="18" y="10" width="2" height="5" fill="#7c4dff"/>
  <rect x="18" y="9" width="2" height="1" fill="#4decd4"/>

  <!-- 3. Mikroskop -->
  <rect x="32" y="3" width="3" height="1" fill="#5f7a9f"/>
  <rect x="33" y="4" width="1" height="3" fill="#5f7a9f"/>
  <rect x="31" y="7" width="5" height="2" fill="#5f7a9f"/>
  <rect x="32" y="9" width="3" height="2" fill="#4decd4">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="11" width="7" height="1" fill="#5f7a9f"/>
  <rect x="33" y="12" width="1" height="3" fill="#5f7a9f"/>
  <rect x="29" y="15" width="9" height="1" fill="#5f7a9f"/>

  <!-- 4. Laptop / kod -->
  <rect x="45" y="6" width="11" height="6" fill="#5f7a9f"/>
  <rect x="46" y="7" width="9" height="4" fill="#0d1117"/>
  <rect x="47" y="8" width="3" height="1" fill="#4decd4"/>
  <rect x="51" y="8" width="2" height="1" fill="#7c4dff"/>
  <rect x="47" y="10" width="4" height="1" fill="#80f4e5">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="44" y="12" width="13" height="1" fill="#3d4a6b"/>
  <rect x="43" y="13" width="15" height="1" fill="#5f7a9f"/>
  <rect x="50" y="13" width="1" height="1" fill="#7a8cb3"/>

  <!-- 5. AI chip -->
  <rect x="68" y="5" width="6" height="1" fill="#5f7a9f"/>
  <rect x="67" y="6" width="8" height="9" fill="#1a2847"/>
  <rect x="68" y="7" width="6" height="7" fill="#3d4a6b"/>
  <rect x="69" y="8" width="4" height="1" fill="#4decd4">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="69" y="10" width="4" height="1" fill="#7c4dff">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <rect x="69" y="12" width="4" height="1" fill="#4decd4">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.2s"/>
  </rect>
  <rect x="66" y="8" width="1" height="1" fill="#5f7a9f"/>
  <rect x="66" y="10" width="1" height="1" fill="#5f7a9f"/>
  <rect x="66" y="12" width="1" height="1" fill="#5f7a9f"/>
  <rect x="75" y="8" width="1" height="1" fill="#5f7a9f"/>
  <rect x="75" y="10" width="1" height="1" fill="#5f7a9f"/>
  <rect x="75" y="12" width="1" height="1" fill="#5f7a9f"/>

  <!-- 6. Pixel sparkle ✦ -->
  <rect x="89" y="7" width="1" height="1" fill="#4decd4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="88" y="8" width="3" height="1" fill="#4decd4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="89" y="9" width="1" height="1" fill="#4decd4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="91" y="11" width="2" height="2" fill="#7c4dff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
</svg>

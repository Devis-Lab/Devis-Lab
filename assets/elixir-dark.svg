<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260" viewBox="0 0 44 64" shape-rendering="crispEdges" style="image-rendering:pixelated;">
  <defs>
    <style>
      @keyframes twinkle-d { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes core-pulse { 0%,100%{opacity:0.8} 50%{opacity:1} }
      .cl-l { animation: twinkle-d 2.6s ease-in-out infinite; }
      .cl-r { animation: twinkle-d 3s ease-in-out infinite; animation-delay: 1.1s; }
      .core { animation: core-pulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- LEFT CLUSTER -->
  <g class="cl-l">
    <rect x="2" y="28" width="2" height="2" fill="#4decd4"/>
    <rect x="1" y="31" width="1" height="1" fill="#80f4e5"/>
  </g>

  <!-- RIGHT CLUSTER (krzyzyk) -->
  <g class="cl-r">
    <rect x="40" y="28" width="1" height="1" fill="#4decd4"/>
    <rect x="39" y="29" width="3" height="1" fill="#4decd4"/>
    <rect x="40" y="30" width="1" height="1" fill="#4decd4"/>
  </g>

  <!-- MINT PARTICLES wylatujace z otworu -->
  <rect width="1" height="1" fill="#4decd4">
    <animate attributeName="x" values="21;20;18" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="11;6;0" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect width="2" height="2" fill="#80f4e5">
    <animate attributeName="x" values="22;22;22" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="y" values="10;5;-2" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.7;1" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect width="1" height="1" fill="#4decd4">
    <animate attributeName="x" values="24;25;27" dur="2.6s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="y" values="11;6;1" dur="2.6s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="2.6s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <rect width="1" height="1" fill="#26d4c0">
    <animate attributeName="x" values="20;18;15" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="y" values="11;7;3" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  <rect width="2" height="2" fill="#4decd4">
    <animate attributeName="x" values="24;26;29" dur="2.7s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="y" values="10;6;2" dur="2.7s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.7;1" dur="2.7s" repeatCount="indefinite" begin="1.4s"/>
  </rect>
  <rect width="1" height="1" fill="#80f4e5">
    <animate attributeName="x" values="23;23;24" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="y" values="11;5;-1" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
  </rect>

  <!-- CORK -->
  <rect x="19" y="15" width="6" height="1" fill="#4a5680"/>
  <rect x="18" y="16" width="8" height="2" fill="#5f7a9f"/>
  <rect x="19" y="17" width="6" height="1" fill="#4a5680"/>
  <rect x="17" y="18" width="10" height="1" fill="#7a8cb3"/>

  <!-- NECK -->
  <rect x="18" y="19" width="2" height="6" fill="#5f7a9f"/>
  <rect x="24" y="19" width="2" height="6" fill="#5f7a9f"/>
  <rect x="20" y="19" width="4" height="6" fill="#1a2847" opacity="0.4"/>

  <!-- LEFT WALL (cone) -->
  <rect x="17" y="25" width="2" height="1" fill="#5f7a9f"/>
  <rect x="16" y="26" width="2" height="1" fill="#5f7a9f"/>
  <rect x="15" y="27" width="2" height="1" fill="#5f7a9f"/>
  <rect x="14" y="28" width="2" height="1" fill="#5f7a9f"/>
  <rect x="13" y="29" width="2" height="1" fill="#5f7a9f"/>
  <rect x="12" y="30" width="2" height="1" fill="#5f7a9f"/>
  <rect x="11" y="31" width="2" height="1" fill="#5f7a9f"/>
  <rect x="10" y="32" width="2" height="1" fill="#5f7a9f"/>
  <rect x="9"  y="33" width="2" height="1" fill="#5f7a9f"/>
  <rect x="8"  y="34" width="2" height="1" fill="#5f7a9f"/>
  <rect x="7"  y="35" width="2" height="1" fill="#5f7a9f"/>
  <rect x="6"  y="36" width="2" height="1" fill="#5f7a9f"/>
  <rect x="6"  y="37" width="2" height="13" fill="#5f7a9f"/>

  <!-- RIGHT WALL (cone) -->
  <rect x="25" y="25" width="2" height="1" fill="#5f7a9f"/>
  <rect x="26" y="26" width="2" height="1" fill="#5f7a9f"/>
  <rect x="27" y="27" width="2" height="1" fill="#5f7a9f"/>
  <rect x="28" y="28" width="2" height="1" fill="#5f7a9f"/>
  <rect x="29" y="29" width="2" height="1" fill="#5f7a9f"/>
  <rect x="30" y="30" width="2" height="1" fill="#5f7a9f"/>
  <rect x="31" y="31" width="2" height="1" fill="#5f7a9f"/>
  <rect x="32" y="32" width="2" height="1" fill="#5f7a9f"/>
  <rect x="33" y="33" width="2" height="1" fill="#5f7a9f"/>
  <rect x="34" y="34" width="2" height="1" fill="#5f7a9f"/>
  <rect x="35" y="35" width="2" height="1" fill="#5f7a9f"/>
  <rect x="36" y="36" width="2" height="1" fill="#5f7a9f"/>
  <rect x="36" y="37" width="2" height="13" fill="#5f7a9f"/>

  <!-- INSIDE GLASS (translucent dark) -->
  <rect x="19" y="25" width="6" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="18" y="26" width="8" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="17" y="27" width="10" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="16" y="28" width="12" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="15" y="29" width="14" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="14" y="30" width="16" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="13" y="31" width="18" height="1" fill="#1a2847" opacity="0.4"/>
  <rect x="12" y="32" width="20" height="1" fill="#1a2847" opacity="0.4"/>

  <!-- LIQUID: mint top -> cyan -> violet -->
  <rect x="12" y="32" width="20" height="1" fill="#4decd4"/>
  <rect x="11" y="33" width="22" height="1" fill="#26d4c0"/>
  <rect x="10" y="34" width="24" height="1" fill="#26c6da"/>
  <rect x="9"  y="35" width="26" height="1" fill="#00bcd4"/>
  <rect x="8"  y="36" width="28" height="1" fill="#0097a7"/>
  <rect x="8"  y="37" width="28" height="1" fill="#5e35b1"/>
  <rect x="8"  y="38" width="28" height="1" fill="#5e35b1"/>
  <rect x="8"  y="39" width="28" height="1" fill="#673ab7"/>
  <rect x="8"  y="40" width="28" height="1" fill="#673ab7"/>
  <rect x="8"  y="41" width="28" height="1" fill="#7c4dff"/>
  <rect x="8"  y="42" width="28" height="1" fill="#7c4dff"/>
  <rect x="8"  y="43" width="28" height="1" fill="#6200ea"/>
  <rect x="8"  y="44" width="28" height="1" fill="#6200ea"/>
  <rect x="8"  y="45" width="28" height="1" fill="#5e35b1"/>
  <rect x="8"  y="46" width="28" height="1" fill="#4527a0"/>
  <rect x="8"  y="47" width="28" height="1" fill="#311b92"/>
  <rect x="8"  y="48" width="28" height="1" fill="#1a2847"/>

  <!-- MINT CORE -->
  <g class="core">
    <rect x="21" y="39" width="2" height="2" fill="#4decd4"/>
    <rect x="20" y="40" width="1" height="1" fill="#80f4e5"/>
    <rect x="23" y="40" width="1" height="1" fill="#80f4e5"/>
  </g>

  <!-- BUBBLES -->
  <rect x="14" y="42" width="2" height="2" fill="#80f4e5">
    <animate attributeName="y" values="46;42;38" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="44" width="2" height="2" fill="#4decd4">
    <animate attributeName="y" values="48;44;40" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
  </rect>

  <!-- BASE -->
  <rect x="6" y="50" width="32" height="2" fill="#3d4a6b"/>
  <rect x="7" y="52" width="30" height="1" fill="#2d3b58"/>

  <!-- HIGHLIGHT mint na szkle -->
  <rect x="10" y="35" width="1" height="10" fill="#4decd4" opacity="0.5"/>
  <rect x="18" y="21" width="1" height="3" fill="#80f4e5" opacity="0.6"/>
</svg>
